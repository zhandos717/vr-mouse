[project]
name = "vr-mouse"
version = "0.1.0"
description = "Webcam-based mouse control via hand tracking, face tracking, and voice commands"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "pyautogui>=0.9.54",
    "numpy>=1.26",
    "vosk>=0.3.44",
    "sounddevice>=0.4.6",
]

[project.scripts]
vr-mouse = "vr_mouse.__main__:main"

[tool.setuptools]
packages = ["vr_mouse"]
